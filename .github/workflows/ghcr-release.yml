name: Build AWS release image (GHCR)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Committed branch, tag or SHA to build
        required: true
        default: main
        type: string
      database_mode:
        description: Reviewed database compatibility mode
        required: true
        default: unchanged
        type: choice
        options:
          - unchanged
          - usage-tags-v1
          - usage-tag-time-index-v1

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'youzhou-ali/new-api'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPOSITORY: ghcr.io/youzhou-ali/new-api
      RUNTIME_BASE: calciumion/new-api@sha256:938fa2713d4946723c9e9ce3076351c33f7770699fec92d23f3a26fd95791026
    steps:
      # Keep release tooling at the workflow revision; build_release archives the
      # separately selected source commit, including when rebuilding older code.
      - name: Check out release tooling and source history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select isolated build directory
        run: echo "RELEASE_DIRECTORY=$RUNNER_TEMP/newapi-release" >> "$GITHUB_ENV"

      - name: Resolve committed source and tool versions
        id: source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          source_ref = os.environ['SOURCE_REF']
          if not source_ref or source_ref.startswith('-'):
              raise SystemExit('source_ref must identify a committed Git revision')
          candidates = [source_ref]
          if source_ref.startswith('refs/heads/'):
              candidates.append('refs/remotes/origin/' + source_ref[len('refs/heads/'):])
          elif not source_ref.startswith('refs/'):
              candidates.append('refs/remotes/origin/' + source_ref)
          commit = ''
          for candidate in candidates:
              resolved = subprocess.run(
                  ['git', 'rev-parse', '--verify', '--end-of-options', candidate + '^{commit}'],
                  text=True, capture_output=True)
              if resolved.returncode == 0:
                  commit = resolved.stdout.strip()
                  break
          if not re.fullmatch(r'[0-9a-f]{40,64}', commit):
              raise SystemExit('source_ref does not resolve to a committed source revision')
          go_mod = subprocess.check_output(['git', 'show', commit + ':go.mod'], text=True)
          package = json.loads(subprocess.check_output(['git', 'show', commit + ':web/package.json'], text=True))
          go = re.search(r'(?m)^go (\d+\.\d+\.\d+)$', go_mod)
          bun = re.fullmatch(r'bun@(\d+\.\d+\.\d+)', package.get('packageManager', ''))
          if not go or not bun:
              raise SystemExit('Selected source must pin supported Go and Bun versions')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'commit={commit}\ngo={go[1]}\nbun={bun[1]}\n')
          PY

      - name: Set up selected Go version
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ steps.source.outputs.go }}
          cache: false

      - name: Set up selected Bun version
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.source.outputs.bun }}

      - name: Verify deployment tooling
        run: python3 -m unittest discover -s ops/deploy -p 'test_*.py' -v

      - name: Build embedded frontend and Linux application
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          DATABASE_MODE: ${{ inputs.database_mode }}
        run: |
          python3 ops/deploy/build_release.py --repo "$GITHUB_WORKSPACE" \
            --ref "$SOURCE_COMMIT" --out "$RELEASE_DIRECTORY" \
            --runtime-base "$RUNTIME_BASE" --database-mode "$DATABASE_MODE"

      - name: Read built release identity
        id: release
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads((Path(os.environ['RELEASE_DIRECTORY']) / 'build.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"id={release['release_id']}\ntag={release['release_id'].lower()}\n")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable release image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: ${{ env.RELEASE_DIRECTORY }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ steps.release.outputs.tag }}
          provenance: mode=max
          sbom: true

      - name: Bind published digest to deployment manifest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python3 ops/deploy/build_release.py --finalize "$RELEASE_DIRECTORY" \
            --image-ref "$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads((Path(os.environ['RELEASE_DIRECTORY']) / 'release.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('### Published AWS release\n\n')
              for key in ('release_id', 'commit', 'image_ref', 'database_mode'):
                  output.write(f"- {key}: `{release[key]}`\n")
              output.write('\nDownload the release manifest artifact for stage → prepare → cutover → verify → collect.\n')
          PY

      - name: Upload deployment manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: newapi-release-${{ steps.release.outputs.id }}
          path: ${{ env.RELEASE_DIRECTORY }}/release.json
          if-no-files-found: error
          retention-days: 90
